# The service the Ingress sends traffic to. Container-native load balancing (the NEG annotation) lets Google's load
# balancer reach the pod directly rather than through a node.
apiVersion: v1
kind: Service
metadata:
  name: multi-cloud
  namespace: multi-cloud
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: multi-cloud
  ports:
    - name: http
      port: 80
      targetPort: http
