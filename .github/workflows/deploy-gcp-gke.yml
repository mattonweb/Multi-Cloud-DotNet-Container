# Deploy to Google Kubernetes Engine: copy a published image, by digest, from GitHub Container Registry into Artifact
# Registry, apply the manifests in deploy/gke/ with that digest, and check the new pod answers through Google's load
# balancer. These are the steps in docs/INSTALL-gcp-gke.md, automated (docs/SDD.md sections 16 and 17).
#
# Started only by hand (workflow_dispatch). Left blank, the tag is the newest one Publish image pushed; a tag typed in
# redeploys that image instead. It signs in to Google through Workload Identity Federation, as Deploy to Google Cloud
# Run does, with the same service account and the same two repository secrets. The cluster must already exist.

name: Deploy to Google Kubernetes Engine

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The published image's tag, such as 2026.1111.2. Leave blank for the newest one Publish image pushed.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-gcp-gke
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      IMAGE_NAME: multi-cloud-dotnet-container
      REGION: us-central1
      REPOSITORY: multi-cloud
      CLUSTER: multi-cloud
      NAMESPACE: multi-cloud
      APP: multi-cloud
      SERVICE_ACCOUNT_NAME: github-deployer
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Choose the tag and name the published image
        id: name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "The repository secret GCP_PROJECT_ID is not set; docs/INSTALL-gcp-cloud-run.md says how." >&2
            exit 1
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            # No tag given: ask ghcr.io for the image's tags and take the newest. <YYYY.MMdd>.<run number> sorts by
            # date, then run number, so the newest is the last in version order.
            token="$(curl --silent --show-error --fail --user "$GITHUB_ACTOR:$GITHUB_TOKEN" \
              "https://ghcr.io/token?scope=repository:$owner/$IMAGE_NAME:pull" | jq -r '.token')"
            tag="$(curl --silent --show-error --fail --header "Authorization: Bearer $token" \
              "https://ghcr.io/v2/$owner/$IMAGE_NAME/tags/list?n=1000" \
              | jq -r '.tags[]' | { grep -E '^[0-9]{4}\.[0-9]{4}\.[0-9]+$' || true; } | sort -V | tail -n 1)"
            if [ -z "$tag" ]; then
              echo "No tag was given, and ghcr.io holds no image Publish image pushed. Run Publish image first." >&2
              exit 1
            fi
            echo "No tag was given; deploying the newest published image, $tag."
          fi
          if [[ ! "$tag" =~ ^[0-9]{4}\.[0-9]{4}\.[0-9]+$ ]]; then
            echo "The tag '$tag' is not <YYYY.MMdd>.<run number>, the form Publish image gives." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=ghcr.io/$owner/$IMAGE_NAME:$tag" >> "$GITHUB_OUTPUT"

      - name: Sign in to Google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ env.SERVICE_ACCOUNT_NAME }}@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Copy the image into Artifact Registry
        id: copy
        env:
          TAG: ${{ steps.name.outputs.tag }}
          SOURCE: ${{ steps.name.outputs.source }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The target holds the project ID, a secret, so each step builds it rather than passing it as an output.
          TARGET="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          source_digest="$(docker buildx imagetools inspect --raw "$SOURCE" | sha256sum | cut -d ' ' -f 1)"

          # A carbon copy, registry to registry: the manifest is copied as it is, so the digest does not change.
          docker buildx imagetools create --prefer-index=false --tag "$TARGET:$TAG" "$SOURCE"
          target_digest="$(docker buildx imagetools inspect --raw "$TARGET:$TAG" | sha256sum | cut -d ' ' -f 1)"
          if [ "$source_digest" != "$target_digest" ]; then
            echo "The copy's digest sha256:$target_digest differs from the published sha256:$source_digest." >&2
            exit 1
          fi
          echo "digest=sha256:$source_digest" >> "$GITHUB_OUTPUT"
          echo "Copied $TAG to Artifact Registry, digest sha256:$source_digest"
          docker logout ghcr.io

      - name: Point kubectl at the cluster
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          # The default context name holds the project ID; this one does not.
          context_name: ${{ env.CLUSTER }}

      - name: Apply the manifests with the digest
        id: deploy
        env:
          TAG: ${{ steps.name.outputs.tag }}
          DIGEST: ${{ steps.copy.outputs.digest }}
        run: |
          # GitHub's Ubuntu runners have both; this installs either one only if a runner image ever drops it.
          command -v kubectl > /dev/null || sudo apt-get install --yes --no-install-recommends kubectl
          command -v envsubst > /dev/null || sudo apt-get install --yes --no-install-recommends gettext-base
          export IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE_NAME@$DIGEST"

          # The same commands as the Run step in docs/INSTALL-gcp-gke.md. Applying them again changes only what
          # differs, so a run with the image already deployed leaves the pod as it is.
          kubectl apply -f deploy/gke/namespace.yaml
          envsubst '$IMAGE' < deploy/gke/deployment.yaml | kubectl apply -f -
          kubectl apply -f deploy/gke/service.yaml -f deploy/gke/ingress.yaml
          kubectl rollout status "deployment/$APP" -n "$NAMESPACE" --timeout=10m

          # The pods of the deployment's current revision, which the check below expects an answer from.
          revision="$(kubectl get deployment "$APP" -n "$NAMESPACE" \
            -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"
          hash="$(kubectl get replicasets -n "$NAMESPACE" -l "app=$APP" -o json | jq -r --arg revision "$revision" '
            .items[]
            | select(.metadata.annotations["deployment.kubernetes.io/revision"] == $revision)
            | .metadata.labels["pod-template-hash"]')"
          pods="$(kubectl get pods -n "$NAMESPACE" -l "app=$APP,pod-template-hash=$hash" \
            --field-selector=status.phase=Running -o jsonpath='{.items[*].metadata.name}')"
          if [ -z "$pods" ]; then
            echo "Revision $revision of the deployment has no running pod." >&2
            exit 1
          fi
          for pod in $pods; do
            image_id="$(kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{.status.containerStatuses[0].imageID}')"
            if [[ "$image_id" != *"@$DIGEST" ]]; then
              echo "Pod $pod runs ${image_id##*@}, not $DIGEST." >&2
              exit 1
            fi
          done
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "pods=$pods" >> "$GITHUB_OUTPUT"
          echo "Deployed $TAG as revision $revision of the deployment, pod $pods, running $DIGEST"

      - name: Check the new pod through the load balancer
        id: check
        env:
          PODS: ${{ steps.deploy.outputs.pods }}
        run: |
          # A new Ingress takes a few minutes to get its address, and a few more until Google's health check finds the
          # pod ready; after a rollout the load balancer may answer from the old pod while it drains. Wait for both.
          address=""
          for attempt in $(seq 1 40); do
            address="$(kubectl get ingress "$APP" -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$address" ]; then break; fi
            echo "Waiting for the load balancer's address ($attempt of 40)..."
            sleep 15
          done
          if [ -z "$address" ]; then
            echo "The Ingress has no address after 10 minutes." >&2
            exit 1
          fi
          # The service's public address stays out of this public repository's run logs.
          echo "::add-mask::$address"

          root=""
          for attempt in $(seq 1 40); do
            root="$(curl --silent --max-time 10 "http://$address/" || true)"
            instance="$(echo "$root" | jq -r '.platform.instance? // empty' 2> /dev/null || true)"
            if [ -n "$instance" ] && [[ " $PODS " == *" $instance "* ]]; then break; fi
            echo "Waiting for the new pod to answer through the load balancer ($attempt of 40)..."
            root=""
            sleep 15
          done
          if [ -z "$root" ]; then
            echo "The new pod did not answer through the load balancer within 10 minutes." >&2
            exit 1
          fi

          ping="$(curl --silent --show-error --fail "http://$address/healthz/ping")"
          if [ "$ping" != "up" ]; then
            echo "/healthz/ping answered '$ping', not 'up'." >&2
            exit 1
          fi
          platform="$(echo "$root" | jq -r '.platform.name')"
          instance="$(echo "$root" | jq -r '.platform.instance')"
          remote="$(echo "$root" | jq -r '.request.remoteAddress')"
          echo "The root route answered platform '$platform', instance '$instance', caller's address '$remote'."
          if [ "$platform" != "Kubernetes" ]; then
            echo "The platform should be 'Kubernetes'." >&2
            exit 1
          fi
          # Google's load balancer appends the caller's address and then its own to X-Forwarded-For, and connects
          # from 35.191.0.0/16 or 130.211.0.0/22. Either address here means ForwardedHeaders__ForwardLimit is not
          # trusting both entries (docs/SDD.md, decision D11).
          google_ranges='^(35\.191\.|130\.211\.[0-3]\.)'
          if [ "$remote" = "$address" ] || [[ "$remote" =~ $google_ranges ]]; then
            echo "The reported address is the load balancer's; check ForwardedHeaders__ForwardLimit." >&2
            exit 1
          fi

      - name: Write summary
        if: always()
        env:
          TAG: ${{ steps.name.outputs.tag || inputs.tag }}
          DIGEST: ${{ steps.copy.outputs.digest }}
          REVISION: ${{ steps.deploy.outputs.revision }}
          PODS: ${{ steps.deploy.outputs.pods }}
          COPY_OUTCOME: ${{ steps.copy.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          echo "Deploy \`$TAG\` to Google Kubernetes Engine: copy ${COPY_OUTCOME:-skipped}, deploy ${DEPLOY_OUTCOME:-skipped}, check ${CHECK_OUTCOME:-skipped}." >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIGEST" ]; then echo "Digest: \`$DIGEST\`." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "$REVISION" ]; then echo "Deployment revision $REVISION, pod \`$PODS\`." >> "$GITHUB_STEP_SUMMARY"; fi
